<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail AI Product Description Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #0b1120;
            color: #f1f5f9;
            margin: 0;
            padding: 30px 16px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #1e293b;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 26px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #f8fafc;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
        }
        .btn-submit {
            margin-top: 24px;
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .output-card {
            margin-top: 28px;
            background: #0f172a;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            padding: 20px;
        }
        .output-card h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge {
            background: #0369a1;
            color: #e0f2fe;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            text-transform: capitalize;
        }
        .description-text {
            line-height: 1.6;
            color: #e2e8f0;
            font-size: 15px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GenAI Retail Copywriter</h1>
        <p class="subtitle">ITAI Module 06 • AI in Retail & E-Commerce Personalization Engine</p>

        <form method="POST">
            <label for="product_name">Product Name:</label>
            <input type="text" id="product_name" name="product_name" placeholder="e.g., TrailRunner Pro Waterproof Hiking Boots" value="{{ product_name }}" required>

            <label for="keywords">Key Features & Keywords (comma-separated):</label>
            <input type="text" id="keywords" name="keywords" placeholder="e.g., waterproof, breathable mesh, Vibram grip, ultralight" value="{{ keywords }}" required>

            <label for="tone">Audience Persona / Tone (Stretch Goal):</label>
            <select id="tone" name="tone">
                <option value="neutral" {% if selected_tone == 'neutral' %}selected{% endif %}>Neutral & Informational</option>
                <option value="formal" {% if selected_tone == 'formal' %}selected{% endif %}>Formal & Authoritative</option>
                <option value="casual" {% if selected_tone == 'casual' %}selected{% endif %}>Casual & Approachable</option>
                <option value="humorous" {% if selected_tone == 'humorous' %}selected{% endif %}>Humorous & Witty</option>
                <option value="for young adults" {% if selected_tone == 'for young adults' %}selected{% endif %}>Trendy & Energetic (For Young Adults)</option>
                <option value="for professionals" {% if selected_tone == 'for professionals' %}selected{% endif %}>Executive & High-Performance (For Professionals)</option>
            </select>

            <button type="submit" class="btn-submit">Generate E-Commerce Description</button>
        </form>

        {% if description %}
        <div class="output-card">
            <h3>
                <span>Generated Product Description</span>
                <span class="badge">{{ selected_tone }} tone</span>
            </h3>
            <p class="description-text">{{ description }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
